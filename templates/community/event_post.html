{% extends 'base.html' %}
{% block title %}Post Event – OUR PINCODE{% endblock %}
{% block content %}
<style>
  nav.navbar{display:none!important}
  body{background:#f0f9ff}
  #evpTopBar{position:sticky;top:0;z-index:200;background:#fff;border-bottom:1px solid #bae6fd;padding:12px 16px;display:flex;align-items:center;gap:10px}
  #evpTopBar a{color:#374151;text-decoration:none;font-size:20px}
  #evpTopBar h2{font-size:15px;font-weight:900;color:#111;margin:0;flex:1}
  .evp-form{padding:16px 16px 100px;max-width:600px;margin:0 auto}
  .form-card{background:#fff;border-radius:16px;padding:20px;border:1.5px solid #bae6fd;margin-bottom:14px}
  .form-card h3{font-size:11px;font-weight:800;color:#0891b2;text-transform:uppercase;letter-spacing:.06em;margin:0 0 14px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12px;font-weight:700;color:#374151;margin-bottom:5px}
  .field input,.field textarea{width:100%;padding:11px 13px;border:1.5px solid #bae6fd;border-radius:10px;font-size:14px;box-sizing:border-box;outline:none;font-family:inherit;background:#f0f9ff}
  .field input:focus,.field textarea:focus{border-color:#0891b2;background:#fff}
  .field textarea{min-height:90px;resize:vertical}
  .field-row{display:flex;gap:10px}
  .field-row .field{flex:1;min-width:0}

  .cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .cat-opt{position:relative}
  .cat-opt input[type=radio]{position:absolute;opacity:0;width:0;height:0}
  .cat-opt label{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:12px;border:1.5px solid #bae6fd;cursor:pointer;font-size:10px;font-weight:700;color:#0c4a6e;text-align:center;line-height:1.2;transition:all .15s;background:#f0f9ff}
  .cat-opt label .icon{font-size:22px}
  .cat-opt input:checked + label{border-color:#0891b2;background:#e0f2fe;color:#075985}

  .img-upload{width:100%;height:110px;border:2px dashed #bae6fd;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;background:#f0f9ff;position:relative;overflow:hidden;transition:border-color .15s}
  .img-upload:hover{border-color:#0891b2}
  .img-upload span{font-size:12px;color:#0891b2;position:relative}
  .img-upload .preview{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .submit-btn{width:100%;padding:14px;background:linear-gradient(135deg,#0891b2,#0ea5e9);color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:900;cursor:pointer;font-family:inherit}
</style>

<div id="evpTopBar">
  <a href="/community/events/">&#8592;</a>
  <h2>📅 Post an Event</h2>
</div>

<div class="evp-form">
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}

    <div class="form-card">
      <h3>Category</h3>
      <div class="cat-grid">
        <div class="cat-opt"><input type="radio" name="category" id="cat_festival" value="festival" checked><label for="cat_festival"><span class="icon">🎉</span>Festival</label></div>
        <div class="cat-opt"><input type="radio" name="category" id="cat_sports" value="sports"><label for="cat_sports"><span class="icon">⚽</span>Sports</label></div>
        <div class="cat-opt"><input type="radio" name="category" id="cat_cultural" value="cultural"><label for="cat_cultural"><span class="icon">🎭</span>Cultural</label></div>
        <div class="cat-opt"><input type="radio" name="category" id="cat_health" value="health"><label for="cat_health"><span class="icon">🏥</span>Health</label></div>
        <div class="cat-opt"><input type="radio" name="category" id="cat_edu" value="education"><label for="cat_edu"><span class="icon">📚</span>Education</label></div>
        <div class="cat-opt"><input type="radio" name="category" id="cat_rel" value="religious"><label for="cat_rel"><span class="icon">🕌</span>Religious</label></div>
        <div class="cat-opt"><input type="radio" name="category" id="cat_cleanup" value="cleanup"><label for="cat_cleanup"><span class="icon">🧹</span>Cleanup</label></div>
        <div class="cat-opt"><input type="radio" name="category" id="cat_other" value="other"><label for="cat_other"><span class="icon">📅</span>Other</label></div>
      </div>
    </div>

    <div class="form-card">
      <h3>Event Details</h3>
      <div class="field">
        <label>Event Title *</label>
        <input type="text" name="title" placeholder="e.g. Pongal Celebration at Community Hall" required autocapitalize="words" oninput="var s=this.selectionStart,e=this.selectionEnd;this.value=this.value.replace(/\b\w/g,function(c){return c.toUpperCase()});this.setSelectionRange(s,e)">
      </div>
      <div class="field">
        <label>Description *</label>
        <textarea name="description" placeholder="What's happening, who can attend, what to bring..." required></textarea>
      </div>
    </div>

    <div class="form-card">
      <h3>Date & Venue</h3>
      <div class="field-row">
        <div class="field">
          <label>Date *</label>
          <input type="date" name="event_date" min="{{ today }}" required>
        </div>
        <div class="field">
          <label>Time</label>
          <input type="time" name="event_time">
        </div>
      </div>
      <div class="field">
        <label>Venue / Location *</label>
        <input type="text" name="venue" placeholder="e.g. Gandhi Park, Anna Nagar, Chennai" required>
      </div>
    </div>

    <div class="form-card">
      <h3>Photo (optional)</h3>
      <div class="img-upload" onclick="document.getElementById('evImg').click()">
        <span style="font-size:2rem">📷</span>
        <span>Add a poster or event photo</span>
        <input type="file" id="evImg" name="image" accept="image/*" style="display:none" onchange="previewImg(this)">
      </div>
    </div>

    <button type="submit" class="submit-btn">Post Event 📅</button>
  </form>
</div>

<script>
function previewImg(input){
  if(input.files&&input.files[0]){
    var r=new FileReader();
    r.onload=function(e){
      var box=input.closest('.img-upload');
      var img=box.querySelector('.preview')||document.createElement('img');
      img.className='preview';img.src=e.target.result;
      box.appendChild(img);
      box.querySelectorAll('span').forEach(function(s){s.style.display='none'});
    };
    r.readAsDataURL(input.files[0]);
  }
}
</script>
{% endblock %}
