<!DOCTYPE html>
<html lang="en">
<head>
    {% include "includes/ga4.html" %}
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HR Sign Up — Campus Portal</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', sans-serif; min-height: 100vh;
         background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
         display: flex; align-items: center; justify-content: center; padding: 24px; }
  .box { background: #fff; border-radius: 20px; padding: 40px 36px; width: 100%; max-width: 480px;
         box-shadow: 0 20px 60px rgba(0,0,0,0.4); }
  .top { text-align: center; margin-bottom: 28px; }
  .top .icon { width: 60px; height: 60px; border-radius: 16px;
               background: linear-gradient(135deg, #4f46e5, #7c3aed);
               display: flex; align-items: center; justify-content: center;
               font-size: 1.6rem; margin: 0 auto 14px; }
  .top h2 { font-size: 1.45rem; font-weight: 800; color: #0f172a; }
  .top p { color: #64748b; font-size: 0.87rem; margin-top: 4px; }
  .error-box { background: #fef2f2; border: 1px solid #fca5a5; border-radius: 8px;
               color: #b91c1c; padding: 10px 14px; font-size: 0.88rem; margin-bottom: 18px; }
  label { display: block; font-size: 0.82rem; font-weight: 600; color: #374151; margin-bottom: 4px; }
  input { width: 100%; padding: 11px 13px; border: 1.5px solid #d1d5db; border-radius: 9px;
          font-size: 0.93rem; color: #111; outline: none; margin-bottom: 16px; }
  input:focus { border-color: #4f46e5; box-shadow: 0 0 0 3px rgba(79,70,229,.08); }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .divider { border: none; border-top: 1px solid #e5e7eb; margin: 4px 0 16px; }
  .btn { width: 100%; padding: 13px; background: linear-gradient(135deg,#4f46e5,#7c3aed);
         color: #fff; border: none; border-radius: 10px; font-size: 1rem; font-weight: 700;
         cursor: pointer; margin-top: 4px; transition: opacity .2s; }
  .btn:hover { opacity: 0.9; }
  .foot { text-align: center; margin-top: 18px; font-size: 0.88rem; color: #64748b; }
  .foot a { color: #4f46e5; text-decoration: none; font-weight: 600; }
</style>
</head>
<body>
<div class="box">
  <div class="top">
    <div class="icon">👔</div>
    <h2>HR Sign Up</h2>
    <p>Create your company HR account to post opportunities</p>
  </div>

  {% if error %}<div class="error-box">{{ error }}</div>{% endif %}

  <form method="post">
    {% csrf_token %}

    <label>Full Name *</label>
    <input type="text" name="full_name" placeholder="Your full name" required autofocus>

    <label>Email Address *</label>
    <input type="email" name="email" placeholder="hr@company.com" required>

    <label>Company Name *</label>
    <input type="text" name="company_name" placeholder="Your company / organisation name" required>

    <label>Phone Number</label>
    <input type="tel" name="phone" placeholder="10-digit mobile (optional)" maxlength="10">

    <hr class="divider">

    <div class="row">
      <div>
        <label>Password *</label>
        <input type="password" name="password" placeholder="Min 6 characters" required>
      </div>
      <div>
        <label>Confirm Password *</label>
        <input type="password" name="password2" placeholder="Repeat password" required>
      </div>
    </div>

    <button type="submit" class="btn">Create HR Account</button>
  </form>

  <div class="foot">
    Already have an account? <a href="/campus/hr/login/">Sign In</a><br>
    <a href="/campus/auth/" style="color:#64748b;">← Back</a>
  </div>
</div>
</body>
</html>
