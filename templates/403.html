{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    {% include "includes/ga4.html" %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Denied — OUR PINCODE</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}?v=5">
    <link rel="stylesheet" href="/static/fontawesome/css/all.min.css">
    <style>
        .error-page {
            min-height: calc(100vh - 64px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            background: var(--light-bg);
        }
        .error-card {
            background: var(--white);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            padding: 56px 40px 48px;
            text-align: center;
            max-width: 480px;
            width: 100%;
        }
        .error-icon {
            font-size: 56px;
            color: var(--secondary);
            margin-bottom: 20px;
            opacity: 0.85;
        }
        .error-code {
            font-size: 72px;
            font-weight: 800;
            color: var(--secondary);
            line-height: 1;
            margin-bottom: 8px;
            letter-spacing: -2px;
        }
        .error-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 12px;
        }
        .error-message {
            font-size: 0.95rem;
            color: var(--text-mid);
            line-height: 1.6;
            margin-bottom: 32px;
        }
        .error-actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn-home {
            background: var(--primary);
            color: #fff;
            padding: 12px 28px;
            border-radius: var(--radius-sm);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: background .15s;
        }
        .btn-home:hover { background: var(--primary-dark); color: #fff; }
        .btn-login {
            background: transparent;
            color: var(--primary);
            padding: 12px 20px;
            border-radius: var(--radius-sm);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            border: 1.5px solid var(--primary);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: background .15s, color .15s;
        }
        .btn-login:hover { background: var(--primary); color: #fff; }
        @media (max-width: 480px) {
            .error-card { padding: 40px 24px 36px; }
            .error-code { font-size: 56px; }
        }
    </style>
</head>
<body>

<nav class="navbar">
    <div class="nav-container">
        <a href="/" class="nav-logo">
            <img src="/static/images/ourpincod.jpeg" alt="OUR PINCODE" style="height:40px;width:auto;max-width:140px;object-fit:contain;display:block;">
        </a>
    </div>
</nav>

<div class="error-page">
    <div class="error-card">
        <div class="error-icon"><i class="fas fa-lock"></i></div>
        <div class="error-code">403</div>
        <div class="error-title">Access Denied</div>
        <p class="error-message">You don't have permission to view this page.</p>
        <div class="error-actions">
            <a href="/" class="btn-home"><i class="fas fa-home"></i> Go to Home</a>
            <a href="/login/" class="btn-login"><i class="fas fa-sign-in-alt"></i> Sign In</a>
        </div>
    </div>
</div>

</body>
</html>
