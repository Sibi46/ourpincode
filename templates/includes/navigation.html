{% load interface_language %}
<nav class="opc-bottom-nav" aria-label="Primary navigation">
  <a href="/" {% if request.path == '/' %}aria-current="page"{% endif %}><i class="fas fa-home" aria-hidden="true"></i><span>{% ui "Home" %}</span></a>
  <a href="/advertise/" {% if '/advertise/' in request.path %}aria-current="page"{% endif %}><i class="fas fa-tags" aria-hidden="true"></i><span>{% ui "Offers" %}</span></a>
  <a href="/flicks/" {% if '/flicks/' in request.path %}aria-current="page"{% endif %}><i class="fas fa-film" aria-hidden="true"></i><span>{% ui "Flicks" %}</span></a>
  <a href="/health/" {% if '/health/' in request.path %}aria-current="page"{% endif %}><i class="fas fa-heartbeat" aria-hidden="true"></i><span>{% ui "Health" %}</span></a>
  <a href="/messages/" {% if '/messages/' in request.path %}aria-current="page"{% endif %}><i class="fas fa-comment-dots" aria-hidden="true"></i><span>{% ui "Messages" %}</span></a>
  <a href="{% if request.user.is_authenticated %}/profile/{% else %}/login/{% endif %}" {% if '/profile/' in request.path or '/dashboard/' in request.path or '/coupons/' in request.path %}aria-current="page"{% endif %}><i class="fas fa-user-circle" aria-hidden="true"></i><span>{% ui "My Account" %}</span></a>
</nav>
