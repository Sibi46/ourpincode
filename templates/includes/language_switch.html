{% load i18n %}{% get_current_language as current_language %}
<form class="site-language" action="{% url 'set_language' %}" method="post" data-language-form>
  {% csrf_token %}<input type="hidden" name="next" value="{{ request.get_full_path }}">
  <label class="site-language-label" for="site-language">Language / மொழி</label>
  <select id="site-language" name="language" aria-label="Language / மொழி" onchange="this.form.elements.next.value=location.pathname+location.search+location.hash;this.form.requestSubmit()">
    <option value="en"{% if current_language != 'ta' %} selected{% endif %}>English</option>
    <option value="ta"{% if current_language == 'ta' %} selected{% endif %}>தமிழ்</option>
  </select><noscript><button type="submit">Apply / மாற்றுக</button></noscript>
</form>
