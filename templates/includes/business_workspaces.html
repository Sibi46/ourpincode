{% if business_workspaces %}<section aria-label="Your businesses" style="padding:14px;margin:12px 0;background:#fff;border:1px solid #e2e8f0;border-radius:12px;overflow-wrap:anywhere"><strong>Your businesses</strong><div style="display:flex;gap:8px;flex-wrap:wrap;margin:10px 0">{% for workspace in business_workspaces %}{% if workspace.pk == request.user.pk %}<span aria-current="true" style="padding:9px 12px;background:#eaf2ff;border-radius:8px">{{ workspace.company.company_name|default:workspace.username }} · Current</span>{% else %}<form method="post" action="{% url 'switch_business' workspace.pk %}">{% csrf_token %}<button type="submit" style="padding:9px 12px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;cursor:pointer;max-width:100%;white-space:normal">Switch to {{ workspace.company.company_name|default:workspace.username }}</button></form>{% endif %}{% endfor %}</div><a href="{% url 'add_another_business' %}" style="display:inline-block;padding:10px 14px;background:#0a66c2;color:#fff;border-radius:8px;text-decoration:none">+ Add another business</a></section>{% endif %}
