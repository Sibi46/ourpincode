{% load static %}<link rel="stylesheet" href="{% static 'css/account-shell.css' %}?v=2">
<header class="account-header" aria-label="Site header">
  <a class="account-logo" href="/" aria-label="Our Pincode home"><img src="/static/images/ourpincod.jpeg" alt="OUR PINCODE" width="126" height="42"></a>
  <div class="account-header-actions">
    {% if request.user.is_authenticated %}
    <a class="account-dashboard-link" href="{% if request.user.is_employer %}/employer/dashboard/{% else %}/jobseeker/dashboard/{% endif %}">Dashboard</a>
    <a class="account-signout-link" href="{% url 'logout' %}">Sign out</a>
    {% endif %}
    <a class="account-profile-icon" href="{% if request.user.is_employer %}/employer/dashboard/#my-profile{% else %}{% url 'profile_edit' %}{% endif %}" aria-label="My profile and features" title="My profile and features">{% if profile_photo_url %}<img src="{{ profile_photo_url }}" alt="My profile" data-profile-avatar>{% else %}<svg viewBox="0 0 24 24" width="29" height="29" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="9" r="3"></circle><path d="M5 19c1-6 13-6 14 0"></path></svg>{% endif %}</a>
  </div>
</header>
{% include 'includes/location_permission.html' %}
