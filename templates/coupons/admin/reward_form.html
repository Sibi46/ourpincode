{% extends "coupons/base.html" %}
{% block title %}OPC Admin — {{ action }} Reward{% endblock %}
{% block opc_content %}
<div class="opc-page" style="max-width:520px">
  <div style="margin-bottom:16px">
    <a href="/coupons/admin/rewards/" style="font-size:12px;color:#64748b;text-decoration:none">← Rewards</a>
    <h1 class="opc-page-title" style="margin-top:8px">{{ action }} Reward</h1>
  </div>
  <div class="opc-card">
    <form method="post">
      {% csrf_token %}
      <div class="opc-field">
        <label class="opc-label">Reward Name</label>
        <input class="opc-input" name="name" placeholder="Free Tea" value="{{ reward.name|default:'' }}" required>
      </div>
      <div class="opc-field">
        <label class="opc-label">Business Name</label>
        <input class="opc-input" name="business_name" placeholder="Sri Restaurant" value="{{ reward.business_name|default:'' }}" required>
      </div>
      <div class="opc-field">
        <label class="opc-label">Authorized Redemption Shop</label>
        <select class="opc-input" name="redemption_shop">
          <option value="">Unassigned (redemption blocked)</option>
          {% for shop in shops %}
          <option value="{{ shop.pk }}" {% if reward.redemption_shop_id == shop.pk %}selected{% endif %}>{{ shop.shop_name }} ({{ shop.user.username }})</option>
          {% endfor %}
        </select>
      </div>
      <div class="opc-field">
        <label class="opc-label">Points Required</label>
        <input class="opc-input" type="number" name="points_required" min="1" value="{{ reward.points_required|default:'' }}" required>
      </div>
      <div class="opc-field">
        <label class="opc-label">Description (optional)</label>
        <textarea class="opc-input" name="description" rows="2">{{ reward.description|default:'' }}</textarea>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div class="opc-field">
          <label class="opc-label">Quantity Limit (optional)</label>
          <input class="opc-input" type="number" name="quantity_limit" min="1" value="{{ reward.quantity_limit|default:'' }}">
        </div>
        <div class="opc-field">
          <label class="opc-label">Expiry Date (optional)</label>
          <input class="opc-input" type="date" name="expiry" value="{{ reward.expiry|date:'Y-m-d'|default:'' }}">
        </div>
      </div>
      {% if reward %}
      <div class="opc-field" style="display:flex;align-items:center;gap:10px">
        <input type="checkbox" name="is_active" id="is_active" {% if reward.is_active %}checked{% endif %}>
        <label for="is_active" style="font-size:13px;font-weight:600">Active</label>
      </div>
      {% endif %}
      <button type="submit" class="opc-btn opc-btn-primary" style="width:100%;padding:12px">Save Reward</button>
    </form>
    {% if reward %}
    <form method="post" style="margin-top:10px" onsubmit="return confirm('Delete this reward?')">
      {% csrf_token %}<input type="hidden" name="action" value="delete">
      <button class="opc-btn opc-btn-danger" style="width:100%;padding:10px">Delete Reward</button>
    </form>
    {% endif %}
  </div>
</div>
{% endblock %}
