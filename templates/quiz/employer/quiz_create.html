{% extends "base.html" %}
{% block title %}Create Quiz — OURPINCODE{% endblock %}
{% block content %}
<div style="max-width:500px;margin:30px auto;padding:0 16px 60px">
  <div style="margin-bottom:24px">
    <a href="/quiz/" style="font-size:13px;color:#4f46e5;text-decoration:none">← My Quizzes</a>
    <div style="font-size:22px;font-weight:900;color:#0f172a;margin-top:8px">Create New Quiz</div>
  </div>

  {% if messages %}{% for m in messages %}
  <div style="margin-bottom:14px;padding:10px 14px;border-radius:10px;background:#fee2e2;color:#dc2626;font-size:13px;font-weight:600">{{ m }}</div>
  {% endfor %}{% endif %}

  <div style="background:#fff;border:1.5px solid #e2e8f0;border-radius:14px;padding:28px">
    <form method="post">
      {% csrf_token %}
      <div style="margin-bottom:20px">
        <label for="quiz-pincode" style="display:block;font-size:13px;font-weight:700;color:#374151;margin-bottom:7px">Pincode</label>
        <input id="quiz-pincode" name="pincode" required inputmode="numeric" pattern="[1-9][0-9]{5}" maxlength="6" value="{{ pincode|default:'' }}" placeholder="Enter six-digit pincode"
          style="width:100%;padding:12px 14px;border:1.5px solid #e2e8f0;border-radius:10px;font-size:14px;box-sizing:border-box">
      </div>
      <div style="margin-bottom:20px">
        <label style="display:block;font-size:13px;font-weight:700;color:#374151;margin-bottom:7px">Quiz Title</label>
        <input name="title" required maxlength="200" value="{{ title|default:'' }}" placeholder="e.g. General Knowledge Quiz"
          style="width:100%;padding:12px 14px;border:1.5px solid #e2e8f0;border-radius:10px;font-size:14px;font-weight:600;box-sizing:border-box;outline:none"
          oninput="this.value=this.value.replace(/\b\w/g,c=>c.toUpperCase())">
      </div>
      <button type="submit" style="width:100%;background:#4f46e5;color:#fff;padding:14px;border:none;border-radius:10px;font-size:14px;font-weight:800;cursor:pointer">
        Create Quiz &amp; Add Questions →
      </button>
    </form>
  </div>
</div>
{% endblock %}
