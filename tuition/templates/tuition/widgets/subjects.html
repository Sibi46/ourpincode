<div class="subject-inputs" data-subject-inputs>{% for value in subjects %}<div class="subject-row"><input type="text" name="{{ widget.name }}" value="{{ value }}" maxlength="100" placeholder="e.g. English" aria-label="Subject name"><button type="button" data-remove-subject aria-label="Remove subject">&times;</button></div>{% endfor %}<button type="button" data-add-subject aria-label="Add subject">+ Add subject</button></div>
